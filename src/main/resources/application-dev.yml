spring:
  application:
    name: vibeup

  datasource: #Docker
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vibeup}
    username: ${DB_USERNAME:vibeup}
    password: ${DB_PASSWORD:vibeupjason123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000     # 30s
      idle-timeout: 600000          # 10m
      max-lifetime: 1800000         # 30m

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update              # Dev: update 사용
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true                  # 콘솔에 SQL 출력 (dev 전용)


# Actuator(헬스 등) 개발에서만 노출
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace